description: Chess game analysis session
entrypoint: tool.py:run
examples:
  - input:
      action: "new_game"
      fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
    output:
      state:
        fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
        move_number: 1
      legal_moves: ["e4", "d4", "Nf3", "c4", "..."]
      observation: "White to move. Position: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
  - input:
      action: "move"
      move: "e4"
    output:
      state:
        fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1"
        move_number: 1
      legal_moves: ["e5", "d5", "Nf6", "..."]
      observation: "Black to move. White played e4."
input_schema:
  additionalProperties: false
  properties:
    action:
      enum: ["new_game", "move", "analyze"]
      type: string
    fen:
      type: string
    move:
      type: string
  required:
    - action
  type: object
kind: game-state
limits:
  memory_mb: 256
  output_kb: 32
  timeout_s: 30
name: chess_session
output_schema:
  additionalProperties: false
  properties:
    legal_moves:
      items:
        type: string
      type: array
    observation:
      type: string
    state:
      additionalProperties: true
      type: object
  required:
    - legal_moves
    - observation
    - state
  type: object
parent_version: null
permissions:
  browser: false
  inputs: false
  network: []
  secrets: []
requirements: []
version: 1.0.0
when_to_use: The task requests playing or analyzing a chess game with deterministic state replay.