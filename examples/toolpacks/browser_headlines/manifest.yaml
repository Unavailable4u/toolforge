description: Extract news headlines from website
entrypoint: tool.py:run
examples:
  - input:
      url: "https://news.example.com"
    output:
      headlines:
        - "Breaking: Major tech announcement"
        - "Stocks rally on earnings beat"
        - "New AI model released"
input_schema:
  additionalProperties: false
  properties:
    url:
      type: string
  required:
    - url
  type: object
kind: browser-plan
limits:
  memory_mb: 512
  output_kb: 64
  timeout_s: 60
name: browser_headlines
output_schema:
  additionalProperties: false
  properties:
    headlines:
      items:
        type: string
      type: array
  required:
    - headlines
  type: object
parent_version: null
permissions:
  browser: false
  inputs: false
  network:
    - news.example.com
  secrets: []
requirements: []
version: 1.0.0
when_to_use: The task requests extracting headlines from a news website using browser automation.